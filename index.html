<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f1e9">
  <meta name="description" content="Explore To Breathe, the Fjäll Group Signature Series. A client walkthrough of architecture, materials, and interiors by SECHA.">
  <title>To Breathe — A Signature Walkthrough</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="header">
    <a class="wordmark" href="#introduction" aria-label="To Breathe introduction">to breathe<span>.</span></a>
    <div class="header-center">FJÄLL GROUP <span>×</span> SECHA</div>
    <button class="quiet" id="fullscreen" aria-label="Enter fullscreen">Present <span aria-hidden="true">↗</span></button>
  </header>
  <main id="content" tabindex="-1"></main>
  <footer class="navigation">
    <nav aria-label="Presentation chapters" id="chapters"></nav>
    <div class="step-controls"><span id="counter"></span><button id="previous" aria-label="Previous chapter">←</button><button id="next" aria-label="Next chapter">→</button></div>
    <div class="progress" id="progress"></div>
  </footer>
  <dialog id="source-dialog" aria-labelledby="source-title">
    <div class="dialog-top"><span id="source-title">From the catalogue</span><button id="close-source" aria-label="Close catalogue view">✕</button></div>
    <img id="source-image" alt="">
    <div class="dialog-bottom"><span id="source-caption"></span><a href="/catalogue.pdf" target="_blank" rel="noopener">Open original catalogue ↗</a></div>
  </dialog>
  <div role="status" aria-live="polite" id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
